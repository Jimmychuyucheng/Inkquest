# 20 位陪審員人設（PRD 第 4 節）。研究腳本與 Web App 共用這一份，不要另外複製。
# 編輯人設文字時請把該位的 version 加 1。
personas:
  - code: J01
    name: 詩人
    group: 文學專業
    background: 出版過三本詩集，常任新詩組評審
    focus: 意象、節奏、語言新鮮度
    tone: 精簡、重感受
    enabled: true
    version: 1
  - code: J02
    name: 小說家
    group: 文學專業
    background: 以短篇小說成名，重視敘事技巧

# 研究腳本與 Web App 共用的預設值。數值一律改這裡，不要寫死在程式裡。

# 模型供應商：anthropic 或 mock。環境變數 LLM_PROVIDER 會覆蓋這個值。
default_provider: anthropic

# 模型名稱（PRD 第 10 節）。法官之後可能改成 claude-sonnet-5-5。
models:
  juror: claude-haiku-5-5
  judge: claude-haiku-5-5
  advice: claude-haiku-5-5

# 陪審員呼叫設定
juror:
  # PRD 的「陪審員輸出上限 800 tokens」是預期長度；這裡留餘裕，避免 JSON 被截斷。
  max_tokens: 2000
  # Haiku 5.5 預設會開啟思考（計入輸出 token）。陪審員關閉以節省費用與時間。
  # 可選：disabled、adaptive
  thinking: disabled
  # 思考與輸出的用力程度：low、medium、high；留空表示使用模型預設值。
  effort:
  timeout_seconds: 45
  # 逾時或格式不合時的重試次數（不含第一次）
  max_retries: 2

# 陪審員輸出的字數規定（PRD 第 5 節）；超出 20% 以內可接受
juror_output:
  one_line_max: 40
  comment_min: 120
  comment_max: 250
  length_tolerance: 0.2

# 文類與字數限制（PRD 第 3 節）。字數不含空白與換行；新詩行數以非空白行計。
genres:
  散文:
    min_chars: 300
    max_chars: 5000
    description: 以個人經驗為本的散文
  新詩:
    min_chars: 20
    max_chars: 1500
    max_lines: 60
    description: 現代詩，分行與斷句是表現的一部分
  小品文:
    min_chars: 100
    max_chars: 1200
    description: 篇幅短小、以一個片刻或意念為核心的散文
  極短篇:
    min_chars: 100
    max_chars: 1500
    description: 篇幅極短、重視情節轉折的小說

# 估算費用用的單價（美元／每百萬 token）。以官方定價為準，價格變動時更新這裡。
pricing:
  claude-haiku-5-5:
    input_per_mtok: 0.10
    output_per_mtok: 0.50
  claude-sonnet-5-5:
    input_per_mtok: 2.00
    output_per_mtok: 10.00

# 假資料模式（LLM_PROVIDER=mock）：不呼叫任何模型
mock:
  min_delay_seconds: 1
  max_delay_seconds: 3
  failure_rate: 0.05

# ---- 以下為完整流程（抽陪審員 → 計票 → 法官）的設定 ----

# 陪審團抽選（PRD 第 4 節）：20 選 10，依組別分層
jury:
  size_by_group:
    文學專業: 3
    一般讀者: 3
    跨界視角: 4
  # 成功評閱的陪審員少於這個數字，整次失敗（PRD 第 2 節異常流程）
  min_success: 8
  # 同時呼叫的陪審員數上限
  concurrency: 10

# 法官呼叫設定
judge:
  # PRD 的「法官輸出上限 1,500 tokens」是預期長度；法官保留思考，所以留更多餘裕。
  max_tokens: 4000
  thinking: adaptive
  effort:
  timeout_seconds: 60
  max_retries: 2

# 法官輸出的字數規定（PRD 第 5 節）；超出 20% 以內可接受
judge_output:
  headline_max: 25
  verdict_min: 250
  verdict_max: 400
  minority_min: 100
  minority_max: 200
  disagreement_max: 60
  # 判決書至少要引用幾位陪審員（且須涵蓋不同組別）
  min_cited_jurors: 3
  # 法官不可使用的字眼（不預測比賽結果）；出現就視為不合格並重試
  banned_words: [入選, 得獎, 決審, 獲獎]
  length_tolerance: 0.2

# 修改建議呼叫設定（只在使用者勾選該模組時執行；研究腳本不使用）
advice:
  max_tokens: 4000
  thinking: adaptive
  effort:
  timeout_seconds: 60
  max_retries: 2

# 修改建議輸出的規定（PRD 第 4、5 節：3～6 條，每條引用原文）
advice_output:
  min_items: 3
  max_items: 6
  # 整理給修改建議角色看的「陪審員最常提到的缺點」最多幾條
  max_weaknesses: 12

# 計分與得獎潛力（PRD 第 6 節）
stats:
  # 爭議程度（2026-11-10 依 W0 實測調整：陪審員分數的標準差只有 0～0.5，原門檻幾乎達不到）
  # 主要看支持比例：大於等於 split_low、小於 split_high 為「高」（7／10 支持不算高爭議）；標準差 >= high_std 也算「高」；
  # 標準差 >= mid_std 為「中」；其餘「低」
  controversy_high_std: 2.0
  controversy_mid_std: 0.8
  controversy_split_low: 0.30
  controversy_split_high: 0.70
  # 最常被提到的面向取前幾名
  top_tags: 3
  # 得獎潛力的文字說明：支持比例 >= min 時使用，由高到低比對
  potential_labels:
    - min: 0.75
      label: 陪審團高度肯定
    - min: 0.50
      label: 多數陪審員支持
    - min: 0.25
      label: 意見分歧，少數支持
    - min: 0.0
      label: 陪審團多有保留

# ---- Web App 的額度與限制（PRD 第 3、10 節）。這些是初始值；上線後以資料庫 settings 表為準。----
web:
  # 每人每日投稿次數（A-3）
  daily_quota_per_user: 3
  # 全站每日投稿上限（A-5）
  global_daily_limit: 25
  # 額度以這個時區的 00:00 重置
  timezone: Asia/Taipei
  # 處理中的投稿超過這麼多分鐘還沒結束，就不再擋住使用者送出下一篇
  stale_minutes: 10
  # 同一帳號每分鐘最多幾次送出請求
  rate_limit_per_minute: 3
  # 月費用警戒線（美元）：達 budget_warn_ratio 時後台警示，達 100% 自動暫停投稿（PRD 第 10 節）
  monthly_budget_usd: 12
  budget_warn_ratio: 0.8
  # 回饋模組（B-5）；第一個是預設勾選
  modules: [verdict, jurors, scores, advice]
  default_modules: [verdict]
  # 結果頁「法官總評」看板每組放幾位陪審員（優先放法官點名的人，不夠再補同組其他人）
  verdict_board_by_group:
    文學專業: 2
    一般讀者: 1
    跨界視角: 1
